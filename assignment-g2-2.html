<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>A test page</title>
    <!-- Note: In order to keep things simple for this assignment, I have used the 
    style element below. The convention is to have the CSS in a separate file. -->
    <!-- AI help: I used Cursor to help debug my code and understand the concepts of hover and active. -->
    <style>
        .site-button {
            background-color: purple;
            color: white;
            font-size: 150%;
            margin: 1em;
            padding: 0.5em;
        }

        /* only the first button (rotating-button) should change on hover */
        .rotating-button:hover {
            background-color: white;
            color: purple;
            scale: 1.2;
        }

        /* when the first button is clicked, turn it upside down */
        .rotating-button:active {
            rotate: 180deg;
        }
    </style>
  </head>
  <body>
    <button class="site-button rotating-button">
        😀
        <br>
        Click me!
    </button>
    <br>
    <button class="site-button"">
      A normal ordinary button.
    </button>
  </body>
</html>
